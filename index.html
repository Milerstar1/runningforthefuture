<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCA River Run</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#2980b9;
  --accent:#e74c3c;
  --dark:#2c3e50;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:'Montserrat',sans-serif;
  background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#a1c4fd,#c2e9fb);
  background-size:400% 400%;
  animation:gradientBG 15s ease infinite;
  color:#333;
}

@keyframes gradientBG{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

header{
  background:rgba(41,128,185,.95);
  color:white;
  text-align:center;
  padding:3rem 1rem;
}

main{max-width:1100px;margin:auto;padding:1.5rem;}

.section{
  background:white;
  padding:2rem;
  margin:2rem 0;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  text-align:center;
}

.highlight{
  color:var(--accent);
  font-size:1.6rem;
  font-weight:800;
}

.button-group{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:1rem;
  margin-top:1rem;
}

.button-group a{
  background:var(--primary);
  color:white;
  padding:.75rem 1.5rem;
  border-radius:30px;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}

.button-group a:hover{background:var(--dark);}

footer{
  background:var(--dark);
  color:white;
  text-align:center;
  padding:2rem;
}
</style>
</head>

<body>

<header>
<h1>FCA River Run 5K/10K & 20# Ruck</h1>
</header>

<main>

<div class="section">
<p class="highlight">20th Annual Race — Saturday Sept 5</p>
<img src="newracelogocross2025.png" style="max-width:300px;">
</div>

<div class="section">
<h2>Register</h2>
<p>Race Day Registration: 7:00–7:55 AM</p>

<div class="button-group">
<a href="entryform.pdf">📄 Printable Entry Form</a>
<a href="register.html">💻 Online Registration</a>
</div>
</div>

</main>

<footer>
<p>&copy; 2026 FCA River Run</p>
</footer>

</body>
</html>
